[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rag-benchmark"
version = "0.1.0"
description = "Benchmark FAISS, Chroma, Milvus and Pinecone for RAG retrieval: recall@k, latency, throughput and build time."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jasbir Singh" }]
requires-python = ">=3.12"
keywords = ["rag", "vector-database", "benchmark", "faiss", "chroma", "milvus", "pinecone", "ann"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "faiss-cpu>=1.8",
    "chromadb>=1.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "google-genai>=1.0",
]

[project.optional-dependencies]
milvus = ["pymilvus>=2.5"]
pinecone = ["pinecone>=7"]
local-embed = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
rag-bench = "rag_benchmark.cli:main"

[project.urls]
Homepage = "https://github.com/jasbir101/rag-benchmark"
Issues = "https://github.com/jasbir101/rag-benchmark/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Chroma emits deprecation noise from its own internals; it is not actionable here.
    "ignore::DeprecationWarning:chromadb.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]
