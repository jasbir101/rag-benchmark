# Vector mode: 20k x 384 synthetic embeddings, FAISS + Chroma sweeps.
# Run:  rag-bench vector --config configs/vector-20k.yaml
# CLI flags override anything here, e.g. --n 100000 or --backends faiss.

k: 10
metric: cosine
warmup: 50
backends: [faiss, chroma, milvus, pinecone]   # unavailable backends are skipped
output_dir: results

dataset:
  n: 20000
  dim: 384
  clusters: 64
  cluster_std: 0.05
  queries: 1000
  seed: 42

# A list value is a sweep: each combination becomes its own config.
indexes:
  faiss:
    - {index: flat}
    - {index: hnsw, M: 32, ef_construction: 200, ef_search: [16, 32, 64, 128, 256]}
    - {index: ivf_flat, nlist: 256, nprobe: [2, 4, 8, 16, 32, 64]}
  chroma:
    - {M: 16, ef_construction: 100, ef_search: [16, 32, 64, 128, 256]}
  milvus:
    - {index: hnsw, M: 32, ef_construction: 200, ef_search: [16, 64, 256]}
    - {index: ivf_flat, nlist: 256, nprobe: [4, 16, 64]}
  pinecone:
    - {}
